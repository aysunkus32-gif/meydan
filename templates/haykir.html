{% extends 'base.html' %}
{% block title %}Haykır — Meydan{% endblock %}
{% block extra_css %}
<style>
*{margin:0;padding:0;box-sizing:border-box;}

/* ══════ ÜST BÖLÜM (FİLTRE + KONTROL) ══════ */
.hk-top{
  position:fixed;top:44px;left:0;right:0;z-index:51;
  background:var(--surface);border-bottom:1px solid var(--border);
}

.hk-head{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);
}
.hk-head .hk-logo{font-weight:800;color:var(--accent);font-size:11px;}
.hk-head .hk-day-lbl{color:var(--text-primary);font-weight:600;font-size:11px;}
.hk-head .hk-user-lbl{margin-left:auto;color:var(--accent);font-size:10px;font-weight:500;}
.hk-head .hk-arrow{font-size:11px;transition:transform .2s;color:var(--text-dim);flex-shrink:0;}
.hk-head .hk-arrow.open{transform:rotate(180deg);}

.hk-body{
  display:none;padding:6px 10px 8px;
  border-top:1px solid var(--border);
  animation:slideD .2s ease;
}
.hk-body.open{display:block;}
@keyframes slideD{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

.hk-cols{display:flex;gap:8px;}
.hk-col{flex:1;min-width:0;}
.hk-col-lbl{
  font-size:8px;color:var(--text-dim);font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;padding-left:2px;
}
.hk-scroll{
  max-height:130px;overflow-y:auto;
  display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;
}
.hk-scroll::-webkit-scrollbar{width:3px;}
.hk-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.hk-chip{
  padding:3px 8px;border-radius:5px;cursor:pointer;
  font-size:9px;font-family:'DM Mono',monospace;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text-muted);transition:all .15s;white-space:nowrap;
}
.hk-chip:hover{border-color:var(--accent);color:var(--accent);}
.hk-chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700;}
.hk-chip.reset{border-style:dashed;color:var(--text-dim);}

/* Kontrol çubuğu */
.hk-ctrls{
  display:flex;align-items:center;gap:4px;
  padding:4px 10px;border-top:1px solid var(--border);
}
.hk-btn-sm{
  padding:4px 10px;border-radius:6px;cursor:pointer;
  font-size:10px;font-family:'DM Mono',monospace;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text-muted);transition:all .15s;flex-shrink:0;
}
.hk-btn-sm:hover{border-color:var(--accent);color:var(--accent);}
.hk-btn-sm.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);}
.hk-zoom-lbl{margin-left:auto;font-size:9px;color:var(--text-dim);font-family:'DM Mono',monospace;}

/* ══════ CANVAS ══════ */
.hk-wrap{
  position:fixed;left:0;right:0;bottom:0;
  overflow:hidden;background:var(--bg);
  touch-action:none;
}

#hkCanvas{
  position:absolute;top:0;left:0;
  transform-origin:0 0;
  border:2px solid rgba(231,76,60,.55);
  box-shadow:0 0 30px rgba(231,76,60,.12),inset 0 0 60px rgba(231,76,60,.04);
  border-radius:4px;
  background:
    radial-gradient(circle at 15% 25%,rgba(139,92,246,.03) 0%,transparent 50%),
    radial-gradient(circle at 85% 75%,rgba(231,76,60,.02) 0%,transparent 50%),
    var(--bg);
}

/* ══════ ENTRY ══════ */
.hk-e{
  position:absolute;white-space:nowrap;
  user-select:none;-webkit-user-select:none;
  padding:4px 8px;border-radius:6px;
  transition:background .15s,opacity .3s;
  will-change:opacity;
}
.hk-e:hover{background:rgba(255,255,255,.06);outline:1px solid rgba(255,255,255,.1);}
.hk-e .hk-m{
  display:none;position:absolute;bottom:-22px;left:0;
  font-size:8px;color:var(--text-dim);font-family:'DM Mono',monospace;
  white-space:nowrap;background:var(--surface);padding:2px 6px;
  border-radius:4px;border:1px solid var(--border);z-index:5;
}
.hk-e:hover .hk-m{display:block;}
.hk-ef-glow{filter:drop-shadow(0 0 12px currentColor);}
.hk-ef-blur{filter:blur(1px);}
.hk-ef-shake{animation:hkShk .3s infinite;}
@keyframes hkShk{0%,100%{transform:translateX(0);}25%{transform:translateX(-2px);}75%{transform:translateX(2px);}}
.hk-d90{writing-mode:vertical-rl;}
.hk-d180{transform:rotate(180deg);}
.hk-d270{writing-mode:vertical-lr;transform:rotate(180deg);}

/* ══════ EKLE BUTON ══════ */
.hk-add{
  position:fixed;bottom:20px;right:20px;z-index:60;
  width:48px;height:48px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;
  font-size:24px;cursor:pointer;
  box-shadow:0 4px 20px rgba(139,92,246,.4);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-family:'Syne',sans-serif;
}
.hk-add:hover{transform:scale(1.1);}

/* ══════ EKLEME PANEL ══════ */
.hk-panel{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--surface);border-top:2px solid var(--accent);
  border-radius:16px 16px 0 0;
  padding:16px;max-height:65vh;overflow-y:auto;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
  animation:slideUp .25s ease;
}
.hk-panel.open{display:block;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.hk-panel h3{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--text-primary);margin-bottom:12px;}
.hk-f{margin-bottom:10px;}
.hk-f label{display:block;font-size:9px;color:var(--text-dim);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.hk-f input,.hk-f select{
  width:100%;padding:8px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg);
  color:var(--text-primary);font-size:13px;font-family:'Syne',sans-serif;outline:none;transition:border-color .15s;
}
.hk-f input:focus,.hk-f select:focus{border-color:var(--accent);}
.hk-f input[type="color"]{height:36px;padding:4px;cursor:pointer;}
.hk-f input[type="range"]{padding:0;height:28px;}
.hk-r{display:flex;gap:8px;}
.hk-r .hk-f{flex:1;}
.hk-acts{display:flex;gap:8px;margin-top:12px;}
.hk-ab{flex:1;padding:10px;border-radius:8px;border:none;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:all .15s;}
.hk-ab-p{background:var(--accent);color:#fff;}
.hk-ab-p:hover{opacity:.85;}
.hk-ab-c{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);}
.hk-ab-c:hover{border-color:var(--red);color:var(--red);}

/* ══════ DÜZENLEME PANEL ══════ */
.hk-edit-panel{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:210;
  background:var(--surface);border-top:2px solid var(--yellow);
  border-radius:16px 16px 0 0;
  padding:16px;max-height:70vh;overflow-y:auto;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
  animation:slideUp .25s ease;
}
.hk-edit-panel.open{display:block;}
.hk-edit-panel h3{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--text-primary);margin-bottom:4px;}
.hk-edit-panel .hk-edit-sub{font-size:10px;color:var(--text-dim);font-family:'DM Mono',monospace;margin-bottom:12px;}
.hk-edit-preview{
  background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:16px;margin-bottom:14px;text-align:center;min-height:60px;
  display:flex;align-items:center;justify-content:center;
}
.hk-edit-preview span{
  white-space:nowrap;user-select:none;
}
.hk-ab-del{background:var(--red);color:#fff;}
.hk-ab-del:hover{opacity:.85;}
.hk-ab-save{background:var(--green);color:#fff;}
.hk-ab-save:hover{opacity:.85;}

/* ══════ TOAST ══════ */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:11px;color:var(--text-primary);z-index:300;display:none;font-family:'DM Mono',monospace;}
.toast.show{display:block;}
.toast.ok{border-color:var(--green-border);color:var(--green);}
.toast.err{border-color:var(--red-border);color:var(--red);}

/* ══════ MOBİL ══════ */
@media(max-width:767px){
  .hk-add{width:42px;height:42px;font-size:20px;bottom:16px;right:16px;}
  .hk-panel,.hk-edit-panel{padding:12px;max-height:70vh;}
  .hk-chip{padding:3px 7px;font-size:8px;}
  .hk-scroll{max-height:90px;}
  .hk-btn-sm{padding:3px 8px;font-size:9px;}
}
</style>
{% endblock %}

{% block content %}

<!-- ÜST BÖLÜM -->
<div class="hk-top" id="hkTop">
  <div class="hk-head" onclick="toggleFilter()">
    <span class="hk-logo">🔊 Haykır</span>
    <span>·</span>
    <span class="hk-day-lbl" id="dayLbl">—</span>
    <span class="hk-user-lbl" id="userLbl">Herkes</span>
    <span class="hk-arrow" id="fArrow">▾</span>
  </div>
  <div class="hk-body" id="fBody">
    <div class="hk-cols">
      <div class="hk-col">
        <div class="hk-col-lbl">📅 Tarih</div>
        <div class="hk-scroll" id="dayList"></div>
      </div>
      <div class="hk-col">
        <div class="hk-col-lbl">👤 Kişi</div>
        <div class="hk-scroll" id="userList"></div>
      </div>
    </div>
  </div>
  <div class="hk-ctrls">
    <button class="hk-btn-sm" onclick="doZoom(1.3)" title="Yakınlaştır">＋</button>
    <button class="hk-btn-sm" onclick="doZoom(1/1.3)" title="Uzaklaştır">－</button>
    <button class="hk-btn-sm" onclick="fitAll()" title="Tümünü sığdır">⊞ Tam ekran</button>
    <button class="hk-btn-sm" onclick="resetView()" title="Sıfırla">↺</button>
    <span class="hk-zoom-lbl" id="zoomLbl">100%</span>
  </div>
</div>

<!-- CANVAS -->
<div class="hk-wrap" id="hkWrap">
  <div id="hkCanvas"></div>
</div>

<button class="hk-add" onclick="openPanel()" title="Haykır!">+</button>

<!-- EKLEME PANEL -->
<div class="hk-panel" id="hkPanel">
  <h3>Haykır!</h3>
  <div class="hk-f"><label>Metin</label><input type="text" id="pContent" placeholder="Haykırmak istediğini yaz..." maxlength="200"></div>
  <div class="hk-r">
    <div class="hk-f"><label>Boyut</label><input type="range" id="pSize" min="7" max="100" value="28"></div>
    <div class="hk-f"><label>Renk</label><input type="color" id="pColor" value="#ffffff"></div>
  </div>
  <div class="hk-r">
    <div class="hk-f"><label>Yön</label><select id="pDir"><option value="0">Yatay →</option><option value="90">Dikey ↓</option><option value="180">Ters ←</option><option value="270">Dikey ters ↑</option></select></div>
    <div class="hk-f"><label>Font</label><select id="pFont"><option value="Syne">Syne</option><option value="DM Mono">DM Mono</option><option value="serif">Serif</option><option value="cursive">Cursive</option></select></div>
  </div>
  <div class="hk-r">
    <div class="hk-f"><label>Efekt</label><select id="pFx"><option value="none">Yok</option><option value="glow">Parıltı</option><option value="blur">Bulanık</option><option value="shake">Titreşim</option></select></div>
    <div class="hk-f"><label>Gölge</label><select id="pSh"><option value="none">Yok</option><option value="soft">Yumuşak</option><option value="hard">Sert</option><option value="neon">Neon</option></select></div>
  </div>
  <div class="hk-acts">
    <button class="hk-ab hk-ab-c" onclick="closePanel()">İptal</button>
    <button class="hk-ab hk-ab-p" onclick="submitEntry()">Haykır!</button>
  </div>
</div>

<!-- DÜZENLEME PANEL -->
<div class="hk-edit-panel" id="hkEditPanel">
  <h3>Düzenle</h3>
  <div class="hk-edit-sub" id="editSub">—</div>
  <div class="hk-edit-preview" id="editPreview"><span>—</span></div>
  <div class="hk-f"><label>Metin</label><input type="text" id="eContent" placeholder="Metin..." maxlength="200"></div>
  <div class="hk-r">
    <div class="hk-f"><label>Boyut</label><input type="range" id="eSize" min="7" max="100" value="28"></div>
    <div class="hk-f"><label>Renk</label><input type="color" id="eColor" value="#ffffff"></div>
  </div>
  <div class="hk-r">
    <div class="hk-f"><label>Yön</label><select id="eDir"><option value="0">Yatay →</option><option value="90">Dikey ↓</option><option value="180">Ters ←</option><option value="270">Dikey ters ↑</option></select></div>
    <div class="hk-f"><label>Font</label><select id="eFont"><option value="Syne">Syne</option><option value="DM Mono">DM Mono</option><option value="serif">Serif</option><option value="cursive">Cursive</option></select></div>
  </div>
  <div class="hk-r">
    <div class="hk-f"><label>Efekt</label><select id="eFx"><option value="none">Yok</option><option value="glow">Parıltı</option><option value="blur">Bulanık</option><option value="shake">Titreşim</option></select></div>
    <div class="hk-f"><label>Gölge</label><select id="eSh"><option value="none">Yok</option><option value="soft">Yumuşak</option><option value="hard">Sert</option><option value="neon">Neon</option></select></div>
  </div>
  <div class="hk-acts">
    <button class="hk-ab hk-ab-del" onclick="deleteEntry()">🗑 Sil</button>
    <button class="hk-ab hk-ab-c" onclick="closeEditPanel()">İptal</button>
    <button class="hk-ab hk-ab-save" onclick="saveEntry()">💾 Kaydet</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════
   VERİ
   ═══════════════════════════ */
var allE={}, allDays=[], allUsers=[];
var selDay=null, selUser=null;
var uid={{ session.user_id }};
var firstLoad=true;
var editingEntry=null;

/* ═══════════════════════════
   ZOOM / PAN
   ═══════════════════════════ */
var vS=1, vX=0, vY=0;
var pinchD=0, pinchS=1, pinching=false;
var panning=false, pStart=null;
var tStart=null, tMoved=false;
var lastTap=0, lastTapP=null;
var CW=4000, CH=3000;

var wrap=document.getElementById('hkWrap');
var cvs=document.getElementById('hkCanvas');

function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast show '+t;setTimeout(function(){e.className='toast';},2000);}
function zoomLbl(){document.getElementById('zoomLbl').textContent=Math.round(vS*100)+'%';}
function applyT(){cvs.style.transform='translate('+vX+'px,'+vY+'px) scale('+vS+')';zoomLbl();}

function posCanvas(){
  var th=document.getElementById('hkTop').offsetHeight||0;
  wrap.style.top=(44+th)+'px';
}
window.addEventListener('resize',posCanvas);

/* ═══════════════════════════
   ZOOM BUTONLARI
   ═══════════════════════════ */
function doZoom(f){
  var cx=wrap.clientWidth/2, cy=wrap.clientHeight/2;
  var ns=Math.max(.04,Math.min(6,vS*f));
  vX=cx-(cx-vX)*(ns/vS); vY=cy-(cy-vY)*(ns/vS); vS=ns; applyT();
}
function resetView(){vS=1;vX=0;vY=0;applyT();}

function fitAll(){
  var els=cvs.querySelectorAll('.hk-e');
  if(!els.length)return;
  var mnX=1e9,mnY=1e9,mxX=0,mxY=0;
  els.forEach(function(el){
    if(el.style.display==='none')return;
    var l=parseInt(el.style.left)||0, t=parseInt(el.style.top)||0;
    var w=el.offsetWidth||200, h=el.offsetHeight||40;
    if(l<mnX)mnX=l; if(t<mnY)mnY=t;
    if(l+w>mxX)mxX=l+w; if(t+h>mxY)mxY=t+h;
  });
  if(!isFinite(mnX))return;
  var pad=40, bw=mxX-mnX+pad*2, bh=mxY-mnY+pad*2;
  var ww=wrap.clientWidth, wh=wrap.clientHeight;
  var ns=Math.max(.04,Math.min(4,Math.min(ww/bw,wh/bh)));
  vS=ns; vX=(ww-bw*ns)/2-mnX*ns+pad*ns; vY=(wh-bh*ns)/2-mnY*ns+pad*ns; applyT();
}

/* ═══════════════════════════
   MOUSE ZOOM + PAN
   ═══════════════════════════ */
wrap.addEventListener('wheel',function(e){
  e.preventDefault();
  var r=wrap.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  var f=e.deltaY<0?1.15:1/1.15, ns=Math.max(.04,Math.min(6,vS*f));
  vX=mx-(mx-vX)*(ns/vS); vY=my-(my-vY)*(ns/vS); vS=ns; applyT();
},{passive:false});

wrap.addEventListener('mousedown',function(e){
  if(e.target.closest('.hk-e'))return;
  panning=true; pStart={x:e.clientX,y:e.clientY,vx:vX,vy:vY};
  wrap.style.cursor='grabbing';
});
document.addEventListener('mousemove',function(e){
  if(!panning)return;
  vX=pStart.vx+(e.clientX-pStart.x); vY=pStart.vy+(e.clientY-pStart.y); applyT();
});
document.addEventListener('mouseup',function(){panning=false;wrap.style.cursor='';});

/* Çift tıkla → boş alana haykır, kendi entry'sine düzenle */
wrap.addEventListener('dblclick',function(e){
  var ownEntry=e.target.closest('.hk-e[data-own="1"]');
  if(ownEntry){
    var eid=parseInt(ownEntry.getAttribute('data-eid'));
    openEditPanel(eid);
    return;
  }
  if(e.target.closest('.hk-e'))return;
  var r=wrap.getBoundingClientRect();
  var wx=(e.clientX-r.left-vX)/vS, wy=(e.clientY-r.top-vY)/vS;
  openPanel(wx,wy);
});

/* ═══════════════════════════
   TOUCH: PAN + PINCH + ÇİFT DOKUN
   ═══════════════════════════ */
wrap.addEventListener('touchstart',function(e){
  if(e.target.closest('.hk-e[data-own="1"]')){
    if(e.touches.length===1){
      var now=Date.now();
      var el=e.target.closest('.hk-e');
      if(now-lastTap<350&&lastTapP){
        var tt=e.touches[0];
        var dx=tt.clientX-lastTapP.x, dy=tt.clientY-lastTapP.y;
        if(Math.sqrt(dx*dx+dy*dy)<40){
          var eid=parseInt(el.getAttribute('data-eid'));
          openEditPanel(eid);
          lastTap=0;lastTapP=null;return;
        }
      }
      lastTap=now;lastTapP={x:e.touches[0].clientX,y:e.touches[0].clientY};
    }
    return;
  }
  if(e.target.closest('.hk-e'))return;
  if(e.touches.length===2){
    pinching=true;panning=false;
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchD=Math.sqrt(dx*dx+dy*dy);pinchS=vS;return;
  }
  if(e.touches.length!==1)return;
  var t=e.touches[0];
  tStart={x:t.clientX,y:t.clientY};tMoved=false;
  panning=true;pStart={x:t.clientX,y:t.clientY,vx:vX,vy:vY};
},{passive:true});

wrap.addEventListener('touchmove',function(e){
  if(pinching&&e.touches.length===2){
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    var d=Math.sqrt(dx*dx+dy*dy);
    var ns=Math.max(.04,Math.min(6,pinchS*(d/pinchD)));
    var r=wrap.getBoundingClientRect();
    var cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
    var cy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    vX=cx-(cx-vX)*(ns/vS); vY=cy-(cy-vY)*(ns/vS); vS=ns; applyT();return;
  }
  if(!panning||e.touches.length!==1)return;
  var t=e.touches[0];
  if(tStart){
    var dx=t.clientX-tStart.x, dy=t.clientY-tStart.y;
    if(Math.sqrt(dx*dx+dy*dy)>10)tMoved=true;
  }
  if(tMoved){
    vX=pStart.vx+(t.clientX-pStart.x); vY=pStart.vy+(t.clientY-pStart.y); applyT();
  }
},{passive:true});

wrap.addEventListener('touchend',function(e){
  if(pinching){pinching=false;return;}
  if(!tMoved&&tStart){
    var now=Date.now();
    if(now-lastTap<350&&lastTapP){
      var dx=tStart.x-lastTapP.x, dy=tStart.y-lastTapP.y;
      if(Math.sqrt(dx*dx+dy*dy)<40){
        var r=wrap.getBoundingClientRect();
        var wx=(tStart.x-r.left-vX)/vS, wy=(tStart.y-r.top-vY)/vS;
        openPanel(wx,wy);
        lastTap=0;lastTapP=null;panning=false;tStart=null;return;
      }
    }
    lastTap=now;lastTapP={x:tStart.x,y:tStart.y};
  }
  panning=false;tStart=null;
});

/* ═══════════════════════════
   FİLTRE
   ═══════════════════════════ */
function toggleFilter(){
  document.getElementById('fBody').classList.toggle('open');
  document.getElementById('fArrow').classList.toggle('open');
  setTimeout(posCanvas,220);
}

function daysForUser(u){
  if(!u)return allDays;
  var d=[];
  allDays.forEach(function(day){
    if((allE[day]||[]).some(function(e){return e.username===u;}))d.push(day);
  });
  return d;
}
function usersForDay(d){
  if(!d)return allUsers;
  var s={};
  (allE[d]||[]).forEach(function(e){s[e.username]=true;});
  return Object.keys(s).sort();
}

function buildDays(){
  var el=document.getElementById('dayList');el.innerHTML='';
  var list=selUser?daysForUser(selUser):allDays;
  list.forEach(function(d){
    var c=document.createElement('div');
    c.className='hk-chip'+(selDay===d?' on':'');
    c.textContent=d;
    c.onclick=function(ev){
      ev.stopPropagation();
      selDay=(selDay===d)?null:d;
      document.getElementById('dayLbl').textContent=selDay||'Tüm günler';
      buildDays();buildUsers();renderEntries();
    };
    el.appendChild(c);
  });
  var r=document.createElement('div');
  r.className='hk-chip reset'+(selDay===null?' on':'');
  r.textContent='Tümü';
  r.onclick=function(ev){
    ev.stopPropagation();selDay=null;
    document.getElementById('dayLbl').textContent='Tüm günler';
    buildDays();buildUsers();renderEntries();
  };
  el.appendChild(r);
}

function buildUsers(){
  var el=document.getElementById('userList');el.innerHTML='';
  var list=selDay?usersForDay(selDay):allUsers;
  list.forEach(function(u){
    var c=document.createElement('div');
    c.className='hk-chip'+(selUser===u?' on':'');
    c.textContent='@'+u;
    c.onclick=function(ev){
      ev.stopPropagation();
      selUser=(selUser===u)?null:u;
      document.getElementById('userLbl').textContent=selUser?'@'+selUser:'Herkes';
      buildDays();buildUsers();renderEntries();
    };
    el.appendChild(c);
  });
  var r=document.createElement('div');
  r.className='hk-chip reset'+(selUser===null?' on':'');
  r.textContent='Herkes';
  r.onclick=function(ev){
    ev.stopPropagation();selUser=null;
    document.getElementById('userLbl').textContent='Herkes';
    buildDays();buildUsers();renderEntries();
  };
  el.appendChild(r);
}

/* ═══════════════════════════
   VERİ YÜKLE
   ═══════════════════════════ */
async function loadEntries(){
  try{
    var res=await fetch('/haykir/api/entries');
    allE=await res.json();
    allDays=Object.keys(allE).sort().reverse();
    var us={};
    Object.values(allE).forEach(function(a){a.forEach(function(e){us[e.username]=true;});});
    allUsers=Object.keys(us).sort();

    if(firstLoad&&allDays.length){
      selDay=allDays[0];
      document.getElementById('dayLbl').textContent=selDay;
      firstLoad=false;
    }
    buildDays();buildUsers();renderEntries();
  }catch(e){console.error(e);}
}

/* ═══════════════════════════
   RENDER — KATMANLI SAYDAMLIK
   ═══════════════════════════ */
   /* ═══ Profil'den gelen koordinata odaklan ═══ */
(function(){
  var params=new URLSearchParams(window.location.search);
  var tx=parseInt(params.get('x')),ty=parseInt(params.get('y'));
  var tday=params.get('day');
  if(tday){
    selDay=tday;
    document.getElementById('dayLbl').textContent=selDay;
  }
  if(!isNaN(tx)&&!isNaN(ty)){
    setTimeout(function(){
      var ww=wrap.clientWidth,wh=wrap.clientHeight;
      vS=2;
      vX=ww/2-tx*vS;
      vY=wh/2-ty*vS;
      applyT();
    },500);
  }
})();

function renderEntries(){
  cvs.innerHTML='';
  var maxR=0,maxB=0;

  if(selDay===null){
    var rev=allDays.slice().reverse();
    rev.forEach(function(day){
      (allE[day]||[]).forEach(function(e){
        if(selUser&&e.username!==selUser)return;
        var d=mkEntry(e,day,1.0);
        cvs.appendChild(d);
        var r=e.x+280, b=e.y+e.font_size+40;
        if(r>maxR)maxR=r; if(b>maxB)maxB=b;
      });
    });
  }else{
    var idx=allDays.indexOf(selDay);
    if(idx<0)return;
    var show=allDays.slice(idx);
    var rev=show.slice().reverse();
    rev.forEach(function(day,distFromEnd){
      var opacity=Math.pow(0.5, rev.length-1-distFromEnd);
      (allE[day]||[]).forEach(function(e){
        if(selUser&&e.username!==selUser)return;
        var d=mkEntry(e,day,opacity);
        cvs.appendChild(d);
        var r=e.x+280, b=e.y+e.font_size+40;
        if(r>maxR)maxR=r; if(b>maxB)maxB=b;
      });
    });
  }

  cvs.style.width=Math.max(CW,maxR+200)+'px';
  cvs.style.height=Math.max(CH,maxB+200)+'px';
}

function mkEntry(e,day,opacity){
  var d=document.createElement('div');
  d.className='hk-e';
  d.setAttribute('data-eid',e.id);
  if(e.user_id===uid)d.setAttribute('data-own','1');
  if(e.direction===90)d.classList.add('hk-d90');
  else if(e.direction===180)d.classList.add('hk-d180');
  else if(e.direction===270)d.classList.add('hk-d270');
  if(e.effect==='glow')d.classList.add('hk-ef-glow');
  else if(e.effect==='blur')d.classList.add('hk-ef-blur');
  else if(e.effect==='shake')d.classList.add('hk-ef-shake');
  if(e.shadow==='soft')d.style.textShadow='0 2px 15px '+e.color;
  else if(e.shadow==='hard')d.style.textShadow='3px 3px 0 rgba(0,0,0,.8)';
  else if(e.shadow==='neon')d.style.textShadow='0 0 10px '+e.color+', 0 0 30px '+e.color+', 0 0 60px '+e.color;
  d.style.left=e.x+'px';
  d.style.top=e.y+'px';
  d.style.fontSize=e.font_size+'px';
  d.style.color=e.color;
  d.style.fontFamily=e.font_family||'Syne';
  d.style.opacity=opacity;
  d.style.cursor=(e.user_id===uid)?'pointer':'default';
  d.style.textShadow=(d.style.textShadow?d.style.textShadow+' ':'')+'0 2px 8px rgba(0,0,0,'+(0.3+opacity*0.4)+')';
  d.textContent=e.content;
  var m=document.createElement('span');m.className='hk-m';
  m.textContent=(e.user_id===uid?'✏️ Çift tıkla · ':'')+'@'+e.username+' · '+day;
  d.appendChild(m);
  if(e.user_id===uid)makeDrag(d,e);
  return d;
}

/* ═══════════════════════════
   SÜRÜKLEME
   ═══════════════════════════ */
function makeDrag(el,entry){
  var sx,sy,ox,oy,on=false,dragged=false;
  function s(cx,cy){sx=cx;sy=cy;ox=entry.x;oy=entry.y;on=true;dragged=false;}
  function m(cx,cy){
    if(!on)return;
    var dx=cx-sx,dy=cy-sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3)dragged=true;
    entry.x=Math.max(0,ox+dx/vS);
    entry.y=Math.max(0,oy+dy/vS);
    el.style.left=entry.x+'px';el.style.top=entry.y+'px';
  }
  function ed(){if(!on)return;on=false;
    if(!dragged)return;
    fetch('/haykir/move',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:entry.id,x:entry.x,y:entry.y})});}
  el.addEventListener('mousedown',function(ev){
    ev.preventDefault();ev.stopPropagation();s(ev.clientX,ev.clientY);
    function mm(e2){m(e2.clientX,e2.clientY);}
    function mu(){ed();document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);}
    document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  });
  el.addEventListener('touchstart',function(ev){
    ev.stopPropagation();if(ev.touches.length!==1)return;
    s(ev.touches[0].clientX,ev.touches[0].clientY);
  },{passive:true});
  el.addEventListener('touchmove',function(ev){
    if(ev.touches.length!==1)return;
    m(ev.touches[0].clientX,ev.touches[0].clientY);
  },{passive:true});
  el.addEventListener('touchend',function(){ed();});
}

/* ═══════════════════════════
   EKLEME PANEL
   ═══════════════════════════ */
var addWX=null,addWY=null;

function openPanel(wx,wy){
  closeEditPanel();
  addWX=(typeof wx==='number')?wx:null;
  addWY=(typeof wy==='number')?wy:null;
  document.getElementById('pContent').value='';
  document.getElementById('pSize').value=28;
  document.getElementById('pColor').value='#ffffff';
  document.getElementById('pDir').value='0';
  document.getElementById('pFont').value='Syne';
  document.getElementById('pFx').value='none';
  document.getElementById('pSh').value='none';
  document.getElementById('hkPanel').classList.add('open');
  document.getElementById('pContent').focus();
}
function closePanel(){document.getElementById('hkPanel').classList.remove('open');}

async function submitEntry(){
  var c=document.getElementById('pContent').value.trim();
  if(!c){toast('Metin boş olamaz','err');return;}
  if(c.length>200){toast('En fazla 200 karakter','err');return;}
  var px,py;
  if(addWX!==null&&addWY!==null){
    px=addWX+Math.random()*40-20;
    py=addWY+Math.random()*40-20;
  }else{
    px=(-vX+wrap.clientWidth/2)/vS+Math.random()*100-50;
    py=(-vY+wrap.clientHeight/2)/vS+Math.random()*100-50;
  }
  px=Math.max(10,px);py=Math.max(10,py);
  var payload={
    content:c,x:px,y:py,
    font_size:parseInt(document.getElementById('pSize').value),
    color:document.getElementById('pColor').value,
    direction:parseInt(document.getElementById('pDir').value),
    font_family:document.getElementById('pFont').value,
    effect:document.getElementById('pFx').value,
    shadow:document.getElementById('pSh').value
  };
  try{
    var res=await fetch('/haykir/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    var data=await res.json();
    if(data.ok){closePanel();toast('Haykırıldı!','ok');await loadEntries();}
    else toast(data.error||'Hata','err');
  }catch(e){toast('Bağlantı hatası','err');}
}

/* ═══════════════════════════
   DÜZENLEME PANEL
   ═══════════════════════════ */
function findEntry(eid){
  for(var d=0;d<allDays.length;d++){
    var arr=allE[allDays[d]]||[];
    for(var i=0;i<arr.length;i++){
      if(arr[i].id===eid)return {entry:arr[i],day:allDays[d]};
    }
  }
  return null;
}

function openEditPanel(eid){
  var found=findEntry(eid);
  if(!found||found.entry.user_id!==uid)return;
  editingEntry=found.entry;
  var e=found.entry;

  closePanel();
  document.getElementById('editSub').textContent='@'+e.username+' · '+found.day+' · #'+e.id;
  document.getElementById('eContent').value=e.content;
  document.getElementById('eSize').value=e.font_size;
  document.getElementById('eColor').value=e.color;
  document.getElementById('eDir').value=String(e.direction||0);
  document.getElementById('eFont').value=e.font_family||'Syne';
  document.getElementById('eFx').value=e.effect||'none';
  document.getElementById('eSh').value=e.shadow||'none';
  updateEditPreview();
  document.getElementById('hkEditPanel').classList.add('open');
  document.getElementById('eContent').focus();
}

function closeEditPanel(){
  document.getElementById('hkEditPanel').classList.remove('open');
  editingEntry=null;
}

function updateEditPreview(){
  var ps=document.getElementById('editPreview').querySelector('span');
  ps.textContent=document.getElementById('eContent').value||'—';
  ps.style.fontSize=Math.min(parseInt(document.getElementById('eSize').value)||28,48)+'px';
  ps.style.color=document.getElementById('eColor').value;
  ps.style.fontFamily=document.getElementById('eFont').value;
  var fx=document.getElementById('eFx').value;
  ps.style.filter='';
  ps.style.animation='';
  if(fx==='glow')ps.style.filter='drop-shadow(0 0 12px currentColor)';
  else if(fx==='blur')ps.style.filter='blur(1px)';
  else if(fx==='shake')ps.style.animation='hkShk .3s infinite';
  var sh=document.getElementById('eSh').value;
  ps.style.textShadow='';
  var c=document.getElementById('eColor').value;
  if(sh==='soft')ps.style.textShadow='0 2px 15px '+c;
  else if(sh==='hard')ps.style.textShadow='3px 3px 0 rgba(0,0,0,.8)';
  else if(sh==='neon')ps.style.textShadow='0 0 10px '+c+', 0 0 30px '+c+', 0 0 60px '+c;
}

/* Canlı önizleme */
['eContent','eSize','eColor','eDir','eFont','eFx','eSh'].forEach(function(id){
  document.getElementById(id).addEventListener('input',updateEditPreview);
  document.getElementById(id).addEventListener('change',updateEditPreview);
});

async function saveEntry(){
  if(!editingEntry)return;
  var c=document.getElementById('eContent').value.trim();
  if(!c){toast('Metin boş olamaz','err');return;}
  if(c.length>200){toast('En fazla 200 karakter','err');return;}
  var payload={
    id:editingEntry.id,
    content:c,
    font_size:parseInt(document.getElementById('eSize').value),
    color:document.getElementById('eColor').value,
    direction:parseInt(document.getElementById('eDir').value),
    font_family:document.getElementById('eFont').value,
    effect:document.getElementById('eFx').value,
    shadow:document.getElementById('eSh').value
  };
  try{
    var res=await fetch('/haykir/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    var data=await res.json();
    if(data.ok){closeEditPanel();toast('Güncellendi!','ok');await loadEntries();}
    else toast(data.error||'Hata','err');
  }catch(e){toast('Bağlantı hatası','err');}
}

async function deleteEntry(){
  if(!editingEntry)return;
  if(!confirm('Bu haykırışı silmek istediğine emin misin?'))return;
  try{
    var res=await fetch('/haykir/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:editingEntry.id})});
    var data=await res.json();
    if(data.ok){closeEditPanel();toast('Silindi!','ok');await loadEntries();}
    else toast(data.error||'Hata','err');
  }catch(e){toast('Bağlantı hatası','err');}
}

/* ═══════════════════════════
   BAŞLANGIÇ
   ═══════════════════════════ */
posCanvas();
loadEntries();
setInterval(loadEntries,10000);
</script>
