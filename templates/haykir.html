{% extends 'base.html' %}
{% block title %}Haykır — Meydan{% endblock %}
{% block extra_css %}
<style>
body{overflow:hidden;}
.hk{display:flex;height:calc(100vh - 56px);position:relative;}

/* ══════ SOL PANEL ══════ */
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;z-index:10;overflow:hidden;}
.sb-header{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);
  padding:14px 16px 10px;border-bottom:1px solid var(--border);font-weight:500;
  display:flex;align-items:center;justify-content:space-between;}
.sb-header .reset{font-size:9px;color:var(--accent);cursor:pointer;letter-spacing:1px;
  text-transform:none;display:none;}
.sb-header .reset:hover{text-decoration:underline;}
.sb-list{flex:1;overflow-y:auto;padding-bottom:40px;}

.sb-day{border-bottom:1px solid rgba(42,46,56,.3);}
.sb-day-head{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;
  font-size:12px;color:var(--text-muted);transition:all .2s;font-family:'DM Mono',monospace;}
.sb-day-head:hover{background:var(--surface-2);color:var(--text-primary);}
.sb-day-head.active{color:var(--accent);font-weight:700;}
.sb-day-head .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot.live{background:var(--green);box-shadow:0 0 6px var(--green-glow);}
.dot.past{background:var(--text-dim);}
.sb-day-head .arrow{margin-left:auto;font-size:10px;transition:transform .2s;}
.sb-day-head.open .arrow{transform:rotate(90deg);}
.sb-day-body{display:none;padding:0 0 6px;}
.sb-day-body.open{display:block;}

.sb-user{padding:4px 14px 4px 28px;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:6px;font-size:11px;
  font-family:'DM Mono',monospace;color:var(--text-muted);}
.sb-user:hover{background:var(--surface-2);color:var(--text-primary);}
.sb-user.active{color:var(--accent);background:var(--accent-bg);}
.sb-user .cnt{font-size:9px;color:var(--text-dim);margin-left:auto;}
.sb-user .arrow2{font-size:8px;transition:transform .15s;}
.sb-user.open .arrow2{transform:rotate(90deg);}
.sb-user-entries{display:none;padding:0 0 4px;}
.sb-user-entries.open{display:block;}

.sb-entry{padding:5px 10px 5px 44px;cursor:pointer;transition:all .15s;
  font-size:10px;font-family:'DM Mono',monospace;color:var(--text-dim);
  display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;}
.sb-entry:hover{background:var(--surface-2);color:var(--text-primary);}
.sb-entry.selected{color:var(--accent);background:var(--accent-bg);}
.sb-entry .clr{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.sb-entry .txt{overflow:hidden;text-overflow:ellipsis;flex:1;}

/* DÜZENLEME BUTONLARI — HER ZAMAN GÖRÜNÜR (kendi entry'lerinde) */
.sb-entry .edit-btns{display:flex;gap:4px;flex-shrink:0;}
.sb-entry .eb{font-size:12px;cursor:pointer;padding:3px 6px;border-radius:6px;
  transition:all .15s;border:none;background:transparent;color:var(--text-muted);
  font-family:'DM Mono',monospace;}
.sb-entry .eb:hover{background:var(--surface-2);color:var(--text-primary);}
.sb-entry .eb.del:hover{color:var(--red);}
.sb-entry .eb.edt:hover{color:var(--accent);}

/* ══════ CANVAS ══════ */
.canvas-area{flex:1;position:relative;overflow:auto;background:var(--bg);}
.canvas-wrap{position:relative;width:4000px;height:3000px;}
#hkCanvas{position:absolute;top:0;left:0;cursor:crosshair;}
#hkCanvas.dragging{cursor:grabbing;}
#hkCanvas.hovering-own{cursor:pointer;}

/* ══════ BILGI ══════ */
.info-bar{position:fixed;top:70px;right:20px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:8px 14px;font-size:10px;color:var(--text-muted);z-index:50;
  font-family:'DM Mono',monospace;}

/* ══════ YAZI PANELI ══════ */
.wp{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px 20px;z-index:100;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5);
  animation:fadeUp .2s ease;min-width:520px;}
.wp.open{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;}
.wp-title{width:100%;font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:4px;padding-bottom:6px;
  border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.wp-title .close-x{cursor:pointer;color:var(--text-dim);font-size:14px;}
.wp-title .close-x:hover{color:var(--red);}
.wf{display:flex;flex-direction:column;gap:4px;}
.wf label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);}
.wf input,.wf select{background:var(--surface-2);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;color:var(--text-primary);font-family:'DM Mono',monospace;
  font-size:12px;outline:none;transition:border-color .2s;}
.wf input:focus,.wf select:focus{border-color:var(--accent);}
.wf input[type="color"]{width:44px;height:36px;padding:2px;cursor:pointer;border-radius:8px;}
.wf input[type="range"]{width:100px;accent-color:var(--accent);}
.wf input[type="text"]{width:200px;}
.wp-btn{padding:10px 20px;border:none;border-radius:8px;font-family:'DM Mono',monospace;
  font-size:11px;cursor:pointer;transition:all .2s;letter-spacing:1px;}
.wp-save{background:var(--accent);color:#fff;}
.wp-save:hover{opacity:.85;}
.wp-del{background:transparent;border:1px solid var(--red);color:var(--red);}
.wp-del:hover{background:var(--red);color:#fff;}
.wp-cancel{background:transparent;border:1px solid var(--border);color:var(--text-muted);}
.wp-cancel:hover{border-color:var(--text-muted);}
.sz-val{font-size:11px;color:var(--accent);min-width:24px;text-align:center;}

/* ══════ TOOLTIP ══════ */
.hk-tooltip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;font-size:10px;color:var(--text-muted);z-index:60;
  font-family:'DM Mono',monospace;display:none;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.3);}

/* ══════ TOAST ══════ */
.hk-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 20px;font-size:12px;color:var(--text-primary);z-index:200;
  box-shadow:0 8px 30px rgba(0,0,0,.4);display:none;font-family:'DM Mono',monospace;}
.hk-toast.show{display:block;animation:fadeUp .2s ease;}
.hk-toast.ok{border-color:var(--green-border);color:var(--green);}
.hk-toast.err{border-color:var(--red-border);color:var(--red);}

/* ══════ MOBIL ══════ */
@media(max-width:700px){
  .sidebar{width:54px;}
  .sb-header{padding:10px 6px;font-size:7px;letter-spacing:1px;}
  .sb-header .reset{display:none!important;}
  .sb-day-head{padding:8px 6px;font-size:9px;}
  .sb-day-head .label-text{display:none;}
  .sb-user{padding:4px 6px;font-size:8px;}
  .sb-user .cnt,.sb-user .arrow2{display:none;}
  .sb-user-entries{display:none!important;}
  .wp{min-width:auto;left:10px;right:10px;transform:none;}
  .wf input[type="text"]{width:120px;}
  .info-bar{top:62px;right:8px;font-size:9px;padding:6px 10px;}
}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
{% endblock %}

{% block content %}
<div class="hk">

  <!-- SOL PANEL -->
  <div class="sidebar">
    <div class="sb-header">
      <span>📅 Günler</span>
      <span class="reset" id="resetFilter" onclick="resetFilter()">✕ Filtreyi kaldır</span>
    </div>
    <div class="sb-list" id="sbList"></div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-area" id="canvasArea">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="hkCanvas" width="4000" height="3000"></canvas>
    </div>
  </div>

  <!-- BILGI -->
  <div class="info-bar" id="infoBar">Tıkla ve haykır! | Bugün: {{ today }}</div>

  <!-- TOOLTIP -->
  <div class="hk-tooltip" id="tooltip"></div>

  <!-- TOAST -->
  <div class="hk-toast" id="toast"></div>

  <!-- YAZMA / DÜZENLEME PANELİ -->
  <div class="wp" id="wp">
    <div class="wp-title">
      <span id="wpTitle">Haykır</span>
      <span class="close-x" onclick="closePanel()">✕</span>
    </div>
    <div class="wf">
      <label>Metin</label>
      <input type="text" id="wpText" placeholder="Haykır..." maxlength="200">
    </div>
    <div class="wf">
      <label>Boyut <span class="sz-val" id="szVal">24</span></label>
      <input type="range" id="wpSize" min="7" max="100" value="24"
        oninput="document.getElementById('szVal').textContent=this.value">
    </div>
    <div class="wf">
      <label>Renk</label>
      <input type="color" id="wpColor" value="#ffffff">
    </div>
    <div class="wf">
      <label>Yön</label>
      <select id="wpDir">
        <option value="0">→ Düz</option>
        <option value="45">↗ Eğik</option>
        <option value="90">↓ Dikey</option>
        <option value="135">↙ Eğik</option>
        <option value="180">← Ters</option>
        <option value="270">↑ Yukarı</option>
      </select>
    </div>
    <button class="wp-btn wp-save" id="wpSave" onclick="panelSave()">HAYKIR!</button>
    <button class="wp-btn wp-del" id="wpDel" onclick="panelDelete()" style="display:none;">Sil</button>
    <button class="wp-btn wp-cancel" onclick="closePanel()">İptal</button>
  </div>
</div>

<script>
const MY_ID = {{ session.user_id }};
const TODAY = '{{ today }}';
const canvas = document.getElementById('hkCanvas');
const ctx = canvas.getContext('2d');

let allEntries = {};
let hitRegions = [];
let selectedDay = TODAY;
let filterUser = null;
let selectedEntry = null;
let editMode = null;
let editEntryId = null;
let pendingPos = null;

// Sürükleme
let dragEntry = null;
let dragOffset = {x:0, y:0};
let dragStartPos = null;
let isDragging = false;
const DRAG_THRESHOLD = 8;

// ═══════════════════════════════════════════
//  VERİ YÜKLEME
// ═══════════════════════════════════════════

async function loadEntries() {
  try {
    const res = await fetch('/haykir/api/entries');
    if (!res.ok) return;
    allEntries = await res.json();
    renderSidebar();
    renderCanvas();
  } catch(e) { console.error(e); }
}

// ═══════════════════════════════════════════
//  SOL PANEL
// ═══════════════════════════════════════════

function renderSidebar() {
  const list = document.getElementById('sbList');
  list.innerHTML = '';
  const days = Object.keys(allEntries).sort().reverse();

  days.forEach(day => {
    const entries = allEntries[day];
    if (!entries || !entries.length) return;

    const users = {};
    entries.forEach(e => {
      if (!users[e.username]) users[e.username] = [];
      users[e.username].push(e);
    });

    const dayDiv = document.createElement('div');
    dayDiv.className = 'sb-day';
    const isToday = day === TODAY;
    const isOpen = day === selectedDay;

    const head = document.createElement('div');
    head.className = 'sb-day-head' + (isOpen ? ' active open' : '');
    head.innerHTML = `<div class="dot ${isToday ? 'live' : 'past'}"></div>
      <span class="label-text">${isToday ? 'Bugün' : day}</span>
      <span class="arrow">▶</span>`;
    head.onclick = () => {
      selectDay(day);
      const body = dayDiv.querySelector('.sb-day-body');
      const isOpen2 = body.classList.contains('open');
      document.querySelectorAll('.sb-day-body').forEach(b => b.classList.remove('open'));
      document.querySelectorAll('.sb-day-head').forEach(h => h.classList.remove('open'));
      if (!isOpen2) {
        body.classList.add('open');
        head.classList.add('open');
      }
    };
    dayDiv.appendChild(head);

    const body = document.createElement('div');
    body.className = 'sb-day-body' + (isOpen ? ' open' : '');

    Object.keys(users).sort().forEach(username => {
      const uEntries = users[username];
      const isOwn = uEntries.some(e => e.user_id === MY_ID);

      const uDiv = document.createElement('div');
      uDiv.className = 'sb-user' + (filterUser === username ? ' active' : '');
      uDiv.innerHTML = `<span class="arrow2">▶</span>
        <span>${isOwn ? '⭐' : '👤'} @${username}</span>
        <span class="cnt">${uEntries.length}</span>`;
      uDiv.onclick = (ev) => {
        ev.stopPropagation();
        toggleUserFilter(username);
        const ue = uDiv.nextElementSibling;
        const isOpenU = ue && ue.classList.contains('sb-user-entries') && ue.classList.contains('open');
        uDiv.parentElement.querySelectorAll('.sb-user-entries').forEach(u => u.classList.remove('open'));
        uDiv.parentElement.querySelectorAll('.sb-user').forEach(u => u.classList.remove('open'));
        if (!isOpenU) {
          if (ue) ue.classList.add('open');
          uDiv.classList.add('open');
        }
      };
      body.appendChild(uDiv);

      const ueDiv = document.createElement('div');
      ueDiv.className = 'sb-user-entries';
      uEntries.forEach(e => {
        const isMine = e.user_id === MY_ID;
        const eDiv = document.createElement('div');
        eDiv.className = 'sb-entry' + (selectedEntry === e.id ? ' selected' : '');
        eDiv.dataset.entryId = e.id;

        let buttonsHtml = '';
        if (isMine) {
          buttonsHtml = `<span class="edit-btns">
            <span class="eb edt" title="Düzenle">✎</span>
            <span class="eb del" title="Sil">🗑</span>
          </span>`;
        }

        eDiv.innerHTML = `<div class="clr" style="background:${e.color}"></div>
          <span class="txt" title="${e.content}">${e.content.substring(0,25)}${e.content.length > 25 ? '...' : ''}</span>
          ${buttonsHtml}`;

        // Entry tıklama → canvas'ta göster
        eDiv.querySelector('.txt').onclick = () => {
          selectedEntry = e.id;
          renderSidebar();
          renderCanvas();
          scrollToEntry(e);
        };

        // Düzenle butonu
        if (isMine) {
          const edtBtn = eDiv.querySelector('.edt');
          if (edtBtn) {
            edtBtn.onclick = (ev) => {
              ev.stopPropagation();
              openEditPanel(e);
            };
          }
          const delBtn = eDiv.querySelector('.del');
          if (delBtn) {
            delBtn.onclick = (ev) => {
              ev.stopPropagation();
              deleteEntry(e.id);
            };
          }
        }

        ueDiv.appendChild(eDiv);
      });
      body.appendChild(ueDiv);
    });

    dayDiv.appendChild(body);
    list.appendChild(dayDiv);
  });

  document.getElementById('resetFilter').style.display = filterUser ? 'block' : 'none';
}

function selectDay(day) {
  selectedDay = day;
  filterUser = null;
  selectedEntry = null;
  renderCanvas();
  renderSidebar();
  document.getElementById('infoBar').textContent = day === TODAY ?
    'Tıkla ve haykır! | Bugün: ' + day : '📖 Okuma modu: ' + day;
}

function toggleUserFilter(username) {
  filterUser = (filterUser === username) ? null : username;
  selectedEntry = null;
  renderSidebar();
  renderCanvas();
}

function resetFilter() {
  filterUser = null;
  selectedEntry = null;
  renderSidebar();
  renderCanvas();
}

function scrollToEntry(e) {
  const area = document.getElementById('canvasArea');
  const rect = canvas.getBoundingClientRect();
  const scale = rect.width / canvas.width;
  area.scrollLeft = e.x * scale - area.clientWidth / 2;
  area.scrollTop = e.y * scale - area.clientHeight / 2;
}

// ═══════════════════════════════════════════
//  CANVAS ÇİZİM
// ═══════════════════════════════════════════

function renderCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0a0b0d';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Izgara
  ctx.strokeStyle = 'rgba(42,46,56,.25)';
  ctx.lineWidth = 0.5;
  for (let gx = 0; gx < canvas.width; gx += 100) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
  }
  for (let gy = 0; gy < canvas.height; gy += 100) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
  }

  const days = Object.keys(allEntries).sort();
  const todayIdx = days.indexOf(TODAY);
  hitRegions = [];

  days.forEach((day, idx) => {
    const entries = allEntries[day];
    if (!entries || !entries.length) return;

    let baseAlpha = 1.0;
    if (day !== TODAY) {
      const dayDiff = todayIdx - idx;
      baseAlpha = Math.max(0.12, 1.0 / (dayDiff + 1));
    }

    entries.forEach(e => {
      let alpha = baseAlpha;

      if (filterUser) {
        alpha = (e.username === filterUser) ? Math.max(alpha, 0.9) : Math.min(alpha, 0.08);
      }
      if (selectedEntry && e.id !== selectedEntry) {
        alpha = Math.min(alpha, 0.15);
      }

      let ex = e.x, ey = e.y;
      if (dragEntry && dragEntry.id === e.id) {
        ex = dragEntry._vx;
        ey = dragEntry._vy;
      }

      ctx.globalAlpha = alpha;
      ctx.save();
      ctx.translate(ex, ey);
      ctx.rotate((e.direction || 0) * Math.PI / 180);
      ctx.font = `bold ${e.font_size}px 'Syne', sans-serif`;
      ctx.fillStyle = e.color || '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,.5)';
      ctx.shadowBlur = 3;
      ctx.fillText(e.content, 0, 0);
      ctx.restore();

      // Hit region
      ctx.font = `bold ${e.font_size}px 'Syne', sans-serif`;
      const tw = ctx.measureText(e.content).width;
      hitRegions.push({
        id: e.id, x: ex, y: ey, w: tw, h: e.font_size * 1.2,
        userId: e.user_id, _entry: e
      });
    });
  });

  ctx.globalAlpha = 1.0;

  // Seçili entry vurgusu
  if (selectedEntry) {
    const sel = hitRegions.find(r => r.id === selectedEntry);
    if (sel) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'var(--accent)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(sel.x - 4, sel.y - sel.h - 2, sel.w + 8, sel.h + 8);
      ctx.setLineDash([]);
    }
  }
}

// ═══════════════════════════════════════════
//  HIT TEST
// ═══════════════════════════════════════════

function hitTest(mx, my) {
  for (let i = hitRegions.length - 1; i >= 0; i--) {
    const r = hitRegions[i];
    const pad = 6;
    if (mx >= r.x - pad && mx <= r.x + r.w + pad &&
        my >= r.y - r.h - pad && my <= r.y + pad * 2) {
      return r;
    }
  }
  return null;
}

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

// ═══════════════════════════════════════════
//  MOUSE EVENTS
// ═══════════════════════════════════════════

canvas.addEventListener('mousedown', function(e) {
  if (e.button !== 0) return;
  const pos = getCanvasPos(e);
  const hit = hitTest(pos.x, pos.y);

  if (hit && hit.userId === MY_ID) {
    dragEntry = {...hit._entry, _vx: hit.x, _vy: hit.y};
    dragOffset = {x: pos.x - hit.x, y: pos.y - hit.y};
    dragStartPos = {x: pos.x, y: pos.y};
    isDragging = false;
    canvas.classList.add('dragging');
    e.preventDefault();
    return;
  }

  if (hit) {
    selectedEntry = hit.id;
    renderSidebar();
    renderCanvas();
    return;
  }

  // Boş alan → yeni haykır (sadece bugün)
  if (selectedDay === TODAY) {
    pendingPos = pos;
    openNewPanel();
  }
});

canvas.addEventListener('mousemove', function(e) {
  const pos = getCanvasPos(e);

  // Sürükleme kontrolü — eşik değeri ile
  if (dragEntry) {
    if (!isDragging && dragStartPos) {
      const dx = pos.x - dragStartPos.x;
      const dy = pos.y - dragStartPos.y;
      if (Math.sqrt(dx * dx + dy * dy) > DRAG_THRESHOLD) {
        isDragging = true;
      }
    }
    if (isDragging) {
      dragEntry._vx = pos.x - dragOffset.x;
      dragEntry._vy = pos.y - dragOffset.y;
      renderCanvas();
    }
    return;
  }

  // Tooltip
  const hit = hitTest(pos.x, pos.y);
  const tooltip = document.getElementById('tooltip');
  if (hit) {
    const entry = hit._entry;
    canvas.classList.add('hovering-own');
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY - 30) + 'px';
    tooltip.textContent = `@${entry.username}: ${entry.content.substring(0,40)}`;
  } else {
    canvas.classList.remove('hovering-own');
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mouseup', async function(e) {
  // Sürükleme tamamlandı
  if (dragEntry && isDragging) {
    const pos = getCanvasPos(e);
    const nx = pos.x - dragOffset.x;
    const ny = pos.y - dragOffset.y;
    await apiPost('/haykir/move', {id: dragEntry.id, x: nx, y: ny});
    showToast('Taşındı', 'ok');
    dragEntry = null;
    isDragging = false;
    dragStartPos = null;
    canvas.classList.remove('dragging');
    await loadEntries();
    return;
  }

  // Sürükleme olmadı → tıklama
  if (dragEntry && !isDragging) {
    const entry = dragEntry;
    dragEntry = null;
    isDragging = false;
    dragStartPos = null;
    canvas.classList.remove('dragging');

    // Kendi entry → düzenle
    if (entry.user_id === MY_ID) {
      openEditPanel(entry);
    } else {
      selectedEntry = entry.id;
      renderSidebar();
      renderCanvas();
    }
    return;
  }
});

canvas.addEventListener('mouseleave', function() {
  document.getElementById('tooltip').style.display = 'none';
});

// ═══════════════════════════════════════════
//  TOUCH EVENTS (MOBİL)
// ═══════════════════════════════════════════

let touchEntry = null;
let touchStartPos = null;
let longPressTimer = null;

canvas.addEventListener('touchstart', function(e) {
  if (e.touches.length !== 1) return;
  const touch = e.touches[0];
  const pos = getCanvasPos(touch);
  const hit = hitTest(pos.x, pos.y);

  if (hit) {
    touchEntry = hit._entry;
    touchStartPos = pos;

    if (hit.userId === MY_ID) {
      // Uzun basma → sürükleme
      longPressTimer = setTimeout(() => {
        dragEntry = {...hit._entry, _vx: hit.x, _vy: hit.y};
        dragOffset = {x: pos.x - hit.x, y: pos.y - hit.y};
        isDragging = true;
        canvas.classList.add('dragging');
        if (navigator.vibrate) navigator.vibrate(50);
      }, 500);
    }
    e.preventDefault();
  }
}, {passive: false});

canvas.addEventListener('touchmove', function(e) {
  if (longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
  if (!dragEntry) return;
  e.preventDefault();
  const touch = e.touches[0];
  const pos = getCanvasPos(touch);
  dragEntry._vx = pos.x - dragOffset.x;
  dragEntry._vy = pos.y - dragOffset.y;
  renderCanvas();
}, {passive: false});

canvas.addEventListener('touchend', async function(e) {
  if (longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }

  if (dragEntry && isDragging) {
    await apiPost('/haykir/move', {id: dragEntry.id, x: dragEntry._vx, y: dragEntry._vy});
    showToast('Taşındı', 'ok');
    dragEntry = null;
    isDragging = false;
    canvas.classList.remove('dragging');
    touchEntry = null;
    await loadEntries();
    return;
  }

  // Kısa dokunma
  if (touchEntry) {
    if (touchEntry.user_id === MY_ID) {
      openEditPanel(touchEntry);
    } else {
      selectedEntry = touchEntry.id;
      renderSidebar();
      renderCanvas();
    }
    touchEntry = null;
    return;
  }

  // Boş alan
  if (e.changedTouches.length) {
    const touch = e.changedTouches[0];
    const pos = getCanvasPos(touch);
    const hit = hitTest(pos.x, pos.y);
    if (selectedDay === TODAY && !hit) {
      pendingPos = pos;
      openNewPanel();
    }
  }
});

// ═══════════════════════════════════════════
//  PANEL (YENİ / DÜZENLE)
// ═══════════════════════════════════════════

function openNewPanel() {
  editMode = 'new';
  editEntryId = null;
  document.getElementById('wpTitle').textContent = '📢 Yeni Haykır';
  document.getElementById('wpText').value = '';
  document.getElementById('wpSize').value = 24;
  document.getElementById('szVal').textContent = '24';
  document.getElementById('wpColor').value = '#ffffff';
  document.getElementById('wpDir').value = '0';
  document.getElementById('wpSave').textContent = 'HAYKIR!';
  document.getElementById('wpDel').style.display = 'none';
  document.getElementById('wp').classList.add('open');
  setTimeout(() => document.getElementById('wpText').focus(), 50);
}

function openEditPanel(entry) {
  editMode = 'edit';
  editEntryId = entry.id;
  document.getElementById('wpTitle').textContent = '✎ Düzenle (ID: ' + entry.id + ')';
  document.getElementById('wpText').value = entry.content;
  document.getElementById('wpSize').value = entry.font_size;
  document.getElementById('szVal').textContent = entry.font_size;
  document.getElementById('wpColor').value = entry.color || '#ffffff';
  document.getElementById('wpDir').value = entry.direction || 0;
  document.getElementById('wpSave').textContent = 'Güncelle';
  document.getElementById('wpDel').style.display = 'inline-block';
  document.getElementById('wp').classList.add('open');
  setTimeout(() => document.getElementById('wpText').focus(), 50);
}

function closePanel() {
  document.getElementById('wp').classList.remove('open');
  editMode = null;
  editEntryId = null;
  pendingPos = null;
}

async function panelSave() {
  const text = document.getElementById('wpText').value.trim();
  if (!text) return;

  const payload = {
    content: text,
    font_size: parseInt(document.getElementById('wpSize').value),
    color: document.getElementById('wpColor').value,
    direction: parseInt(document.getElementById('wpDir').value)
  };

  let result;
  if (editMode === 'new' && pendingPos) {
    payload.x = pendingPos.x;
    payload.y = pendingPos.y;
    result = await apiPost('/haykir/add', payload);
  } else if (editMode === 'edit' && editEntryId) {
    payload.id = editEntryId;
    result = await apiPost('/haykir/update', payload);
  }

  if (result && result.ok) {
    showToast(editMode === 'new' ? 'Haykırıldı!' : 'Güncellendi!', 'ok');
  } else if (result && result.error) {
    showToast(result.error, 'err');
  }

  closePanel();
  await loadEntries();
}

async function panelDelete() {
  if (!editEntryId) return;
  if (!confirm('Bu haykırış silinecek. Emin misin?')) return;
  const result = await apiPost('/haykir/delete', {id: editEntryId});
  if (result && result.ok) {
    showToast('Silindi', 'ok');
  }
  closePanel();
  selectedEntry = null;
  await loadEntries();
}

async function deleteEntry(id) {
  if (!confirm('Silinsin mi?')) return;
  const result = await apiPost('/haykir/delete', {id});
  if (result && result.ok) {
    showToast('Silindi', 'ok');
  }
  selectedEntry = null;
  await loadEntries();
}

async function apiPost(url, data) {
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    return await res.json();
  } catch(e) {
    console.error(e);
    return {error: e.message};
  }
}

// ═══════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'hk-toast show ' + type;
  setTimeout(() => { t.className = 'hk-toast'; }, 2500);
}

// ═══════════════════════════════════════════
//  KLAVYE
// ═══════════════════════════════════════════

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closePanel();
  if (e.key === 'Enter' && document.getElementById('wp').classList.contains('open')) {
    e.preventDefault();
    panelSave();
  }
});

// ═══════════════════════════════════════════
//  BAŞLANGIÇ
// ═══════════════════════════════════════════

setInterval(loadEntries, 5000);
loadEntries();
</script>
